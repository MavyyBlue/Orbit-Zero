name: Orbit Zero - Import, Test and APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: orbit-zero-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      ready: ${{ steps.source.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Import uploaded source without touching workflows
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" && "$REF_NAME" == "refs/heads/main" && -f orbit-zero-source.zip ]]; then
            package_hash=$(sha256sum orbit-zero-source.zip | cut -d ' ' -f 1)
            previous_hash=$(cat .orbit-zero-import.sha256 2>/dev/null || true)
            if [[ "$package_hash" != "$previous_hash" ]]; then
              cat > "$RUNNER_TEMP/import_orbit.py" <<'PYTHON'
          """Validate a complete source ZIP before overlaying owned files. Never writes workflows."""
          import hashlib
          import json
          from pathlib import Path, PurePosixPath
          import stat
          import sys
          import zipfile

          MANIFEST = '.orbit-zero-package.json'
          ROOT_FILES = {'README.md', '.gitignore', '.editorconfig', 'package.json', 'settings.gradle', 'build.gradle', 'gradle.properties'}
          ROOT_DIRS = {'web', 'app', 'docs', 'tests', 'scripts', 'dev-signing'}


          def allowed(name):
              p = PurePosixPath(name)
              return (name == str(p) and not p.is_absolute() and '\\' not in name
                      and all(x not in ('', '.', '..', '.git', '.github', 'node_modules', 'build', '.gradle', '__pycache__') for x in p.parts)
                      and (name in ROOT_FILES or (len(p.parts) > 1 and p.parts[0] in ROOT_DIRS)))


          def import_zip(archive, root):
              root = Path(root).resolve()
              with zipfile.ZipFile(archive) as z:
                  items = z.infolist()
                  names = [i.filename for i in items]
                  if len(items) > 500 or len(names) != len(set(names)):
                      raise ValueError('Too many files or duplicate archive entries')
                  if MANIFEST not in names or sum(i.file_size for i in items) > 20 * 1024 * 1024:
                      raise ValueError('Missing manifest or archive too large')
                  for i in items:
                      if i.is_dir() or stat.S_ISLNK(i.external_attr >> 16) or i.flag_bits & 1:
                          raise ValueError('Directories, symlinks, or encrypted files are forbidden')
                      if i.filename != MANIFEST and not allowed(i.filename):
                          raise ValueError('Forbidden path: ' + i.filename)
                  manifest = json.loads(z.read(MANIFEST))
                  if manifest.get('format') != 1 or manifest.get('project') != 'orbit-zero':
                      raise ValueError('Wrong package format/project')
                  hashes = manifest['files']
                  if not isinstance(hashes, dict) or set(names) != set(hashes) | {MANIFEST}:
                      raise ValueError('Manifest/archive mismatch')
                  payload = {}
                  for name, expected in hashes.items():
                      data = z.read(name)
                      if hashlib.sha256(data).hexdigest() != expected:
                          raise ValueError('Hash mismatch: ' + name)
                      destination = root / name
                      if not destination.resolve().is_relative_to(root):
                          raise ValueError('Path escapes checkout')
                      for parent in [destination, *destination.parents]:
                          if parent == root:
                              break
                          if parent.is_symlink():
                              raise ValueError('Symlink destination')
                      payload[name] = data
                  old_path = root / MANIFEST
                  if old_path.is_symlink():
                      raise ValueError('Symlink manifest')
                  old = json.loads(old_path.read_text()) if old_path.exists() else {'files': {}}
                  if old_path.exists() and (old.get('format') != 1 or old.get('project') != 'orbit-zero'):
                      raise ValueError('Unrecognized existing package ownership')
                  removed = set(old['files']) - set(hashes)
                  if removed:
                      raise ValueError('Removed paths require explicit migration: ' + ', '.join(sorted(removed)))
                  for name, data in payload.items():
                      dest = root / name
                      if not dest.exists():
                          continue
                      if not dest.is_file():
                          raise ValueError('Destination is not a file: ' + name)
                      current = dest.read_bytes()
                      if current == data:
                          continue
                      if name in old['files']:
                          if hashlib.sha256(current).hexdigest() != old['files'][name]:
                              raise ValueError('Modified source conflict: ' + name)
                      elif name != 'README.md':
                          raise ValueError('Unowned file conflict: ' + name)
                  for name, data in payload.items():
                      dest = root / name
                      dest.parent.mkdir(parents=True, exist_ok=True)
                      dest.write_bytes(data)
                  old_path.write_bytes(z.read(MANIFEST))
              print(f'Validated and imported {len(payload)} source files; workflows untouched.')


          if __name__ == '__main__':
              import_zip(sys.argv[1], sys.argv[2] if len(sys.argv) > 2 else '.')
          PYTHON
              python3 "$RUNNER_TEMP/import_orbit.py" orbit-zero-source.zip .
              printf '%s\n' "$package_hash" > .orbit-zero-import.sha256
              python3 - <<'PYTHON'
          import json, subprocess
          from pathlib import Path
          paths = list(json.loads(Path('.orbit-zero-package.json').read_text())['files'])
          paths += ['.orbit-zero-package.json', '.orbit-zero-import.sha256']
          subprocess.run(['git', 'add', '--', *paths], check=True)
          PYTHON
              if ! git diff --cached --quiet; then
                git config user.name 'github-actions[bot]'
                git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                git commit -m 'Import Orbit Zero source package'
                git push origin HEAD:refs/heads/main
              fi
            fi
          fi
          if [[ ! -f package.json || ! -f app/build.gradle ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo '## Waiting for source ZIP' >> "$GITHUB_STEP_SUMMARY"
            echo 'Upload orbit-zero-source.zip to the repository root on main. No APK has been built.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          candidate_sha=$(git rev-parse HEAD)
          echo "sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "Candidate to validate: $candidate_sha" >> "$GITHUB_STEP_SUMMARY"

  validate:
    needs: source
    if: needs.source.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Deterministic simulation, save, UI logic and importer tests
        run: |
          npm run validate
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Browser smoke and phone-sized screenshots
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
          npx playwright install --with-deps chromium
          python3 -m http.server 8080 --directory web > "$RUNNER_TEMP/orbit-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          python3 - <<'PYTHON'
          import time, urllib.request
          for _ in range(50):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8080', timeout=1).close()
                  break
              except OSError:
                  time.sleep(0.1)
          else:
              raise RuntimeError('Local preview server did not start')
          PYTHON
          node scripts/browser-smoke.mjs
      - name: Build and lint Android debug APK
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          gradle --no-daemon :app:assembleDebug :app:lintDebug
      - name: Record exact source and APK checksums
        env:
          CANDIDATE: ${{ needs.source.outputs.sha }}
        run: |
          mkdir -p build/evidence
          git rev-parse HEAD > build/evidence/source-sha.txt
          test "$(cat build/evidence/source-sha.txt)" = "$CANDIDATE"
          sha256sum app/build/outputs/apk/debug/app-debug.apk > build/evidence/apk-sha256.txt
          echo "## Orbit Zero candidate validated" >> "$GITHUB_STEP_SUMMARY"
          echo "Source SHA: $CANDIDATE" >> "$GITHUB_STEP_SUMMARY"
          echo 'Simulation, saves, UI logic, ZIP safety, browser smoke, Android build and lint passed.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Independent QA and physical-phone acceptance remain pending. Debug APK only; not a store release.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: orbit-zero-debug-${{ needs.source.outputs.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            build/evidence/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbit-zero-validation-${{ needs.source.outputs.sha }}
          path: |
            build/screenshots/
            app/build/reports/
          if-no-files-found: ignore
          retention-days: 30
