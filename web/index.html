<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080e1c"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'"><title>Orbit Zero</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="room-layouts.css"><link rel="stylesheet" href="mockup-layout.css"><link rel="stylesheet" href="workshop.css"></head>
<body><main id="app"><canvas id="space" aria-label="Orbit Zero flight field. Drag back from the ship and release to launch. Keyboard aiming controls are also available." tabindex="0"></canvas>
<header id="hud" hidden><div><span class="eyebrow" id="sectorLabel">SECTOR 01</span><strong id="score">0</strong></div><div class="hud-right"><span id="combo">×1</span><button id="pause" aria-label="Pause game">Ⅱ</button></div></header>
<div id="notice" role="status" aria-live="polite"></div><div id="toast" role="status" aria-live="polite"></div>
<section id="home" class="screen art-home">
  <div class="brand"><div class="dock-label"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="art/arcade/icons.svg#orbit"/></svg><span>ORBITAL ARCADE · SOLO FLIGHT</span></div><h1>ORBIT<br><span>ZERO</span><sup>✦</sup></h1><p>Gravity is an invitation.</p><span class="hero-caption">A SMALL SHIP. AN IMPOSSIBLE LINE.</span></div>
  <div class="home-bottom">
    <div class="record"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="art/arcade/icons.svg#trophy"/></svg><span>PERSONAL BEST<strong id="homeBest">0</strong></span><span class="record-trail">✦</span></div>
    <button id="play" class="primary"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="art/arcade/icons.svg#ship"/></svg><span>Begin voyage<small>12 sectors · find your line</small></span><b aria-hidden="true">↗</b></button>
    <div class="split"><button id="endless"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="art/arcade/icons.svg#infinity"/></svg><span>Endless<small>Chase one more orbit</small></span></button><button id="workshop"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="art/arcade/icons.svg#paint"/></svg><span>Workshop<small>Create your own orbit</small></span></button></div>
    <nav class="links" aria-label="Dock navigation"><button id="hangar"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="art/arcade/icons.svg#ship"/></svg><span>Hangar</span></button><button id="settings"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="art/arcade/icons.svg#gear"/></svg><span>Settings</span></button><button id="help"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="art/arcade/icons.svg#help"/></svg><span>How to fly</span></button></nav>
    <div class="support-row"><button id="donate"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="art/arcade/icons.svg#heart"/></svg><span>Support Orbit Zero</span></button><button id="donateInfo" aria-label="About the creators and support"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="art/arcade/icons.svg#info"/></svg></button></div>
  </div>
</section>
<section id="panel" class="screen modal" hidden aria-label="Game menu"><div id="panelBody"></div></section>
<section id="workshopUI" hidden aria-label="Level workshop"></section>
<div id="aimControls" hidden><p id="aimHint">Pull back from the ship. Release to fly.</p><div id="assist" hidden><label>Direction <input id="angle" type="range" min="-75" max="75" value="0" aria-label="Launch angle"></label><label>Power <input id="power" type="range" min="20" max="100" value="75" aria-label="Launch power"></label><button id="launchButton">Launch ↗</button></div><button id="aimToggle" class="quiet">Button aiming</button></div>
<footer id="saveWarning" hidden>Saving unavailable. Progress lasts for this session.</footer></main><script type="module" src="game.js"></script></body></html>
